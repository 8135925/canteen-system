# 本地开发：PostgreSQL 供后端联调
# 用法：docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canteen
      POSTGRES_PASSWORD: canteen123
      POSTGRES_DB: canteen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
